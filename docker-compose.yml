# Stress IoT stack: Python inference (ML) + lightweight Node.js dashboard/API.
#
# Usage:
#   cp .env.example .env   # edit MONGODB_URI if you want high-stress logs
#   docker compose up --build
#
# Dashboard/API: http://localhost:8090   Inference: http://localhost:8081

services:
  inference:
    build:
      context: .
      dockerfile: docker/Dockerfile.inference
    image: stress-detection-inference:latest
    ports:
      - "8081:8081"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    image: stress-detection-node:latest
    ports:
      - "8090:8090"
    environment:
      STRESS_INFERENCE_BASE_URL: http://inference:8081
      STRESS_CSV_PATH: /app/balanced_data.csv
      STRESS_INTERVAL_MS: 5000
      STRESS_CHART_HISTORY_SIZE: 60
      MONGODB_URI: ${MONGODB_URI:-}
    depends_on:
      inference:
        condition: service_healthy
    restart: unless-stopped
