server:
  # Change if busy: --server.port=8080
  port: 8090

spring:
  application:
    name: iot-stress-backend
  config:
    # Optional: spring-backend/application-local.yml (Mongo URI, etc.) — see application-local.example.yml
    import: optional:file:./application-local.yml
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

stress:
  # When running `mvn spring-boot:run` from spring-backend/, ../ points at Stress_detection/
  csv-path: ../balanced_data.csv
  inference-base-url: http://127.0.0.1:8081
  simulated-interval-ms: 5000
  chart-history-size: 60
  # Optional application-local.yml overrides this. Env: MONGODB_URI or STRESS_MONGODB_URI.
  mongodb-uri: ${MONGODB_URI:${STRESS_MONGODB_URI:}}
